  <script src="js/animations.js"></script>
  <script>
    function toggleMenu() {
      var menu = document.getElementById('mobile-menu');
      var iconMenu = document.getElementById('icon-menu');
      var iconClose = document.getElementById('icon-close');
      var isClosed = menu.classList.contains('mobile-menu--closed');
      if (isClosed) {
        menu.classList.remove('mobile-menu--closed', 'mobile-menu--instant-close');
        menu.setAttribute('aria-hidden', 'false');
        iconMenu.classList.add('hidden');
        iconClose.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
      } else {
        menu.classList.add('mobile-menu--closed');
        menu.setAttribute('aria-hidden', 'true');
        iconMenu.classList.remove('hidden');
        iconClose.classList.add('hidden');
        document.body.style.overflow = '';
      }
    }
    function closeMenuForNavigation() {
      var menu = document.getElementById('mobile-menu');
      var iconMenu = document.getElementById('icon-menu');
      var iconClose = document.getElementById('icon-close');
      menu.classList.add('mobile-menu--instant-close', 'mobile-menu--closed');
      menu.setAttribute('aria-hidden', 'true');
      iconMenu.classList.remove('hidden');
      iconClose.classList.add('hidden');
      document.body.style.overflow = '';
    }
  </script>
